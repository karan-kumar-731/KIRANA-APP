<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kirana Shop 🛒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              saffron: {
                DEFAULT: '#FF6B00',
                light: '#FF8C33',
                pale: '#FFF3E8',
              },
              kgreen: {
                DEFAULT: '#2E7D32',
                light: '#4CAF50',
              },
            },
            fontFamily: {
              display: ['"Baloo 2"', 'cursive'],
              body: ['Hind', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Hind:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: 'Hind', sans-serif; }
      h1, h2, h3, h4, h5 { font-family: 'Baloo 2', cursive; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #FF6B00; border-radius: 3px; }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
  </body>
</html>
